<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skyline Drift</title>
    <style>
      :root {
        --hud: #7ef9a8;
        --panel: rgba(5, 10, 14, 0.55);
        --panel-border: rgba(126, 249, 168, 0.8);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, Helvetica, sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .panel {
        position: absolute;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        box-shadow: 0 0 10px rgba(126, 249, 168, 0.2);
        color: var(--hud);
        font-family: "Courier New", Courier, monospace;
        padding: 12px 14px;
        border-radius: 8px;
        backdrop-filter: blur(2px);
      }

      #hud {
        top: 18px;
        left: 18px;
        min-width: 220px;
      }

      #hud .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 4px 0;
        font-size: 14px;
      }

      #hud .label {
        opacity: 0.85;
      }

      #controls {
        left: 18px;
        bottom: 18px;
        font-size: 12px;
        line-height: 1.7;
      }

      #radar {
        right: 18px;
        top: 18px;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        overflow: hidden;
      }

      #radar::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(126, 249, 168, 0.15), rgba(126, 249, 168, 0.15)),
          radial-gradient(circle at center, transparent 50%, rgba(0,0,0,0.35) 52%);
        border-radius: 50%;
      }

      #radar .ring {
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(126, 249, 168, 0.6);
        border-radius: 50%;
      }

      #radar .ring:nth-child(2) { inset: 28px; }
      #radar .ring:nth-child(3) { inset: 44px; }
      #radar .ring:nth-child(4) { inset: 60px; }

      #radar .center {
        position: absolute;
        width: 8px;
        height: 8px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        background: #7ef9a8;
        border-radius: 50%;
        box-shadow: 0 0 14px rgba(126, 249, 168, 0.9);
      }

      #radar .dot {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #fff;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 8px rgba(255,255,255,0.7);
      }

      #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 28px;
        height: 28px;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(126, 249, 168, 0.8);
        border-radius: 50%;
        pointer-events: none;
      }

      #crosshair::before,
      #crosshair::after {
        content: "";
        position: absolute;
        background: rgba(126, 249, 168, 0.8);
      }

      #crosshair::before {
        left: 50%;
        top: 2px;
        width: 1px;
        height: 24px;
        transform: translateX(-50%);
      }

      #crosshair::after {
        top: 50%;
        left: 2px;
        width: 24px;
        height: 1px;
        transform: translateY(-50%);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud" class="panel">
        <div class="row"><span class="label">ALT</span><span id="altitude">0</span>m</div>
        <div class="row"><span class="label">SPD</span><span id="speed">0</span>km/h</div>
        <div class="row"><span class="label">HDG</span><span id="heading">0</span>°</div>
        <div class="row"><span class="label">POS</span><span id="position">0, 0</span></div>
        <div class="row"><span class="label">FPS</span><span id="fps">60</span></div>
      </div>

      <div id="crosshair"></div>

      <div id="radar" class="panel">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="center"></div>
      </div>

      <div id="controls" class="panel">
        W / S = Speed<br />
        A / D = Bank<br />
        Space = Climb<br />
        Shift = Dive<br />
        Mouse = Look<br />
        R = Reset
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
